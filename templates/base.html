<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HectorHosting{% endblock %} — VPS & Game Server Hosting</title>
  <meta name="description" content="HectorHosting runs VPS and game servers on NVMe hardware with DDoS protection and instant deployment.">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="skip-link"><a href="#main">Skip to content</a></div>

<header class="site-header">
    <div class="header-row">

        <!-- Logo -->
        <a href="{{ url_for('home') }}" class="brand">
            <img
                src="{{ url_for('static', filename='img/logo.png') }}"
                alt="HectorHosting"
                class="brand-logo"
            >

            <span class="brand-name">
                Hector<span class="brand-accent">Hosting</span>
            </span>
        </a>


        <!-- Mobile menu -->
        <input
            type="checkbox"
            id="nav-toggle"
            class="nav-toggle"
        >

        <label
            for="nav-toggle"
            class="nav-burger"
            aria-label="Open navigation"
        >
            <span></span>
            <span></span>
            <span></span>
        </label>


        <!-- Navigation -->
        <nav class="site-nav">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('game_servers') }}">
                Game Servers
            </a>

            <a href="{{ url_for('vps') }}">
                VPS
            </a>

            <a href="{{ url_for('contact') }}">
                Other Hosting
            </a>

            <a href="{{ url_for('about') }}">
                Company
            </a>

            <a href="{{ url_for('contact') }}">
                Legal
            </a>

        </nav>


        <!-- Right side -->
        <div class="nav-auth">

            <a
                href="{{ url_for('register') }}"
                class="btn btn-primary nav-start"
            >
                Get Started
            </a>

        </div>

    </div>
</header>
      <div class="footer-col">
        <h3>Hosting</h3>
        <a href="{{ url_for('vps') }}">VPS Hosting</a>
        <a href="{{ url_for('game_servers') }}">Game Servers</a>
        <a href="{{ url_for('pricing') }}">Pricing</a>
      </div>
      <div class="footer-col">
        <h3>Company</h3>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('features') }}">Features</a>
        <a href="{{ url_for('contact') }}">Contact</a>
      </div>
      <div class="footer-col">
        <h3>Account</h3>
        <a href="{{ url_for('login') }}">Sign in</a>
        <a href="{{ url_for('register') }}">Create account</a>
      </div>
    </div>
    <div class="wrap footer-bottom">
      <span>© {{ 2026 }} HectorHosting. All rights reserved.</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
